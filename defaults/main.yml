---
# defaults/main.yml - default variables for homescreen role

# Repository URL (GitHub Pages)
homescreen_repo_url: "https://sloppy-giuseppe37.github.io/homescreen"

# Path to the signing public key file (relative to role's files/ directory)
homescreen_pubkey_file: "homescreen.pub"

# Enable automatic upgrades via cron
homescreen_autoupdate_enabled: true

# Cron interval for auto-updates (every 5 minutes by default)
homescreen_autoupdate_cron_minute: "*/5"
homescreen_autoupdate_cron_hour: "*"

# MQTT configuration
homescreen_mqtt_broker: "tcp://localhost:1883"
homescreen_mqtt_prefix: "zigbee2mqtt"

# Zones configuration - override in host_vars or group_vars
# Example:
# homescreen_zones:
#   - name: Upstairs
#     heating:
#       - name: Bedroom
#         unit_id: BedroomFaikin
#     lights:
#       - name: Bedroom
#         entities:
#           - BedroomLight
homescreen_zones: []
