<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faikout MQTT Controller Guide</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 2rem 2rem 4rem; background: #fff; color: #24292f; line-height: 1.7; font-size: 16px; }
  h1 { border-bottom: 2px solid #d0d7de; padding-bottom: .4em; color: #1a1a1a; }
  h2 { border-bottom: 1px solid #d8dee4; padding-bottom: .3em; margin-top: 2.2em; color: #1a1a1a; }
  h3 { margin-top: 1.5em; color: #24292f; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { background: #f0f3f6; padding: .2em .4em; border-radius: 4px; font-size: 85%; color: #1a1a1a; }
  pre { background: #f6f8fa; padding: 1em; border-radius: 6px; overflow-x: auto; border: 1px solid #d0d7de; }
  pre code { background: none; padding: 0; font-size: 85%; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  th, td { border: 1px solid #d0d7de; padding: .5em .75em; text-align: left; }
  th { background: #f6f8fa; font-weight: 600; }
  tr:nth-child(even) { background: #f6f8fa; }
  blockquote { border-left: 4px solid #0969da; margin: 1em 0; padding: .5em 1em; color: #57606a; background: #f6f8fa; border-radius: 0 4px 4px 0; }
  hr { border: none; border-top: 1px solid #d8dee4; margin: 2em 0; }
  #content { opacity: 0; transition: opacity 0.2s; }
  #content.loaded { opacity: 1; }
</style>
</head>
<body>
<div id="content"></div>
<script>
fetch('faikout-mqtt-controller-guide.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
    document.getElementById('content').classList.add('loaded');
  });
</script>
</body>
</html>
