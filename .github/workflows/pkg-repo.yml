name: Build FreeBSD pkg repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build for FreeBSD
        run: |
          GOOS=freebsd GOARCH=amd64 go build -o homescreen -trimpath -ldflags='-s -w' .

      - name: Determine version
        id: version
        run: |
          # Timestamp ensures pkg always sees a newer version; short SHA for traceability
          VERSION="0.$(date -u +%Y%m%d%H%M%S).g${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Write signing key
        run: echo "${{ secrets.PKG_SIGNING_KEY }}" > /tmp/repo.key

      - name: Build .pkg and repository
        run: bash scripts/build-pkg-repo.sh "${{ steps.version.outputs.version }}" /tmp/repo.key

      - name: Clean up signing key
        if: always()
        run: rm -f /tmp/repo.key

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
